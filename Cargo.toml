[package]
name = "xdp-ai-guard"
version = "0.2.0"
edition = "2024"
authors = ["Ankur Rathore"]
license = "MIT OR Apache-2.0"
description = "High-performance AI Inference Guard & eBPF Research Harness"

[dependencies]
# libbpf runtime
libbpf-rs = "0.24"

# Async & CLI
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
ctrlc = "3.4"
# TUI
ratatui = "0.29"
crossterm = "0.28"

[build-dependencies]
libbpf-cargo = "0.24"

[profile.release]
opt-level = 3
lto = true
